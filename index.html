<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode Tracker</title>
    <style>
      /* Paint the theme's background before the stylesheet arrives — in dev, Vite injects it with
         JavaScript after the first paint, which flashed white. Keep in sync with --background in src/index.css. */
      html { background-color: #f6f8fa; color-scheme: light; }
      html.dark { background-color: #0d1117; color-scheme: dark; }
    </style>
    <script>
      // Apply the theme before first paint (shadcn's dark mode is class-based).
      // A choice from the toggle wins; until one is made, follow the OS. Key matches src/lib/theme.ts.
      ;(() => {
        const KEY = 'leetcode-tracker-theme'
        const stored = () => {
          try {
            return localStorage.getItem(KEY)
          } catch {
            return null
          }
        }
        const mq = matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          const choice = stored()
          document.documentElement.classList.toggle('dark', choice ? choice === 'dark' : mq.matches)
        }
        apply()
        mq.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
